# cubeone-mcp / CI
#
# 定位：守住"不依赖 STM32CubeMX 的那部分质量"。
#
# 不做什么（有意为之，不是遗漏）：
#   1. 不在 CI 里跑 CubeMX 生成。CubeMX 是 Windows GUI 应用，需要交互式接受
#      厂商许可，本仓锁定 6.18.1（D1），GitHub Actions 的 runner 上装不起来。
#      ⇒ 端到端（改 .ioc → 生成 → 核验）不在此流水线内，也别指望用 mock 伪装。
#   2. 不装 PlatformIO、不 clone 三个模板仓。成本高，且在没有 CubeMX 的前提下
#      验证不了"生成物是否正确"这个本项目的核心命题。
#      ⇒ L3（pio run）与 L5（实板）证据不来自 CI。
#
# 做什么：Python 单测（3.11/3.13 双档 + 覆盖率回退底线）、Node 单测（18/20/22 三档）、
# Windows 真机 job（win32 分支唯一真跑处）、MCP 工具通道冒烟（fixtures 版）、
# 脚本静态检查 + 脚本文档账目检查。
# 本流水线全绿只说明"脚本与核验器的逻辑没退化"，不说明"某个 .ioc 改对了"。
# 验证等级见 README「验证等级」一节。

name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支/PR 上只保留最新一次运行，旧的直接取消（省 runner 额度，也免得
# 上一轮的红灯在已经修好之后还在页面上挂着）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 单元测试：核验器、.ioc 读写、regen.sh 前置检查 ─────────────────────
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 一个版本红了不要掐掉另一个 —— 需要同时看到 3.11 与 3.13 的结果。
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # tests/ 只用 pytest 一个第三方依赖（scripts/ 全部是标准库）。
      # 版本钉死到本机实测通过的 9.2.0，避免 pytest 大版本升级把用例判据改掉。
      #
      # pytest-cov（C2.2）：**测试工具链**，不是运行时依赖 —— scripts/ 依旧是纯标准库、
      # 装不上任何 pip 包也能跑。这条边界见 README「仓库结构」的声明。
      # 版本同样钉死：coverage 的统计口径（哪些行算"可执行"）跨版本会变，
      # 不钉的话一次工具升级就可能让下面的 fail-under 无端翻红。
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.2.0" "pytest-cov==7.0.0"

      # conftest.py 已把 scripts/ 加进 sys.path，工作目录用仓库根即可，不需要 PYTHONPATH。
      #
      # 覆盖率：**只防回退，不追指标**（C2.2）。
      #   · 基线实测（2026-11-04，本机 win32，Python 3.11.9 与 3.13.14 两档同值）：
      #     TOTAL 37%（ioc_backup 29% / ioc_field 40% / verify_generation 39%）。
      #   · 底线取 36%（基线 -1pp）：只允许统计噪音级的漂移，任何"函数被删了却没补测试"
      #     都会撞线。
      #   · ⚠️ 这个数字**低估**了真实覆盖面：多数用例是**用子进程**调脚本的（`python scripts/xxx.py …`），
      #     子进程内的执行不计入 coverage。所以不要拿它当"覆盖率只有 37%"读，
      #     更不要为了刷数字去改测试的调用方式（那是为指标服务，不是为质量服务）。
      - name: 运行单元测试（含覆盖率回退底线）
        run: |
          python -m pytest tests/ -q \
            --cov=scripts --cov-report=term-missing:skip-covered \
            --cov-fail-under=36

  # ── Node 层单测：MCP 封装层的门禁 ─────────────────────────────────────
  # 为什么单开一个 job：lib/server.mjs 里的路径白名单、写策略、退出码映射是**安全门禁**，
  # 而它们在 M1 之前零测试（审定发现 F4：「安全门禁在 JS 侧却零测试」）。
  # pytest 验的是 Python 判据，验不到 checkPath / isExecFailure / validateArgs。
  node:
    name: node (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 18 是 package.json engines 的下限，必须守住：语法（如 ??=、structuredClone）
      # 与 test runner 行为都可能在新版本才有，只看 20/22 绿等于没测下限。
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # lock 已入库（C2.1），故可以开缓存：命中后 `npm ci` 只需解包，不再访问 registry。
          # 缓存键含 lock 的 hash，lock 一变自动重建。
          cache: npm

      # 用 `npm ci`（C2.1 起）：lock 已在库（`package-lock.json` 于 2026-11-04 入库），
      # 于是可以拿到**可复现**的依赖树 —— install 与 ci 的区别就在"安的必须与 lock 完全一致"，
      # 顺带在 lock 与 package.json 不一致时立刻报错，而不是默默装出一个新树。
      # （历史：M1 期间 lock 被 .gitignore:49 忽略，只能用 npm install；那条限制已解除。）
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 传**显式文件**（由 shell glob 展开），不传目录 —— 实测结论（2026-11-03）：
      #   `node --test <dir>` 在 Node 18.20.8 上会递归展开、在 Node 22.22.2（Windows）上
      #   却把目录当模块加载并报 MODULE_NOT_FOUND。同一份 workflow 要在 18/20/22 三档跑，
      #   目录参数因此不可移植；`node --test <file...>` 两档都实测通过。
      # 用 glob 而不是写死 server.test.mjs：QA 以后加文件不会被静默漏测。
      # 若 glob 无匹配，bash 会把字面量传给 node → 报错判红，不会假装绿。
      - name: Node 层单测（18 / 20）
        if: matrix.node-version != '22'
        run: node --test tests/node/*.test.mjs

      # C1.3：覆盖率**只在 22 档**开（`--experimental-test-coverage` 在 18 上不一定有），
      # 且**只报告不设门槛** —— 先让数字稳定出现几轮，再谈底线。
      # 拍脑袋设阈值的结果通常是：为过线去测 getter，覆盖率涨了、缺陷没少。
      - name: Node 层单测 + 覆盖率报告（22，不设门槛）
        if: matrix.node-version == '22'
        run: node --test --experimental-test-coverage tests/node/*.test.mjs

      # ── MCP 工具通道冒烟（C1.2）────────────────────────────────────────
      # 只跑 22 档：验的是 server 的行为，不是 Node 版本差异，跑三遍纯浪费。
      # 素材来自**入库的** tests/fixtures/e2e/board.ioc（T4/T5），不再依赖 gitignored 的 testbeds。
      # **不带 `--require-materials`**：T6 需要"CubeMX 原始日志 + 真实工程 main.c/.mxproject"三者自洽，
      # 手工拼假素材极容易拼出 `verdict=pass` 的假绿，所以 T6 在 CI 上如实记 SKIP（见脚本注释）。
      # 期望形态：`pass=11 fail=0 skip=1`；`SKIPPED` 行会点名是哪一项，不会被读成通过。
      - uses: actions/setup-python@v6
        if: matrix.node-version == '22'
        with:
          # 冒烟要 spawn Python 跑三个脚本；显式装一个，别赌 runner 镜像里的默认解释器。
          python-version: "3.13"

      - name: MCP 工具通道冒烟（fixtures 版，允许 SKIP）
        if: matrix.node-version == '22'
        env:
          CUBEONE_PYTHON: python
        run: node tools/npm_mcp_handshake.mjs --ci

  # ── Windows 真机 job（C1.1）──────────────────────────────────────────
  # **为什么必须有这个 job**：win32 专属分支在 ubuntu 上全是 skip，等于零覆盖——
  #   · `checkPath` 的大小写归一（Windows 路径大小写不敏感，`D:\Proj` 与 `d:\proj` 是同一处）；
  #   · junction（`mklink /J`）绕出白名单的拦截（R-C2 的核心用例）；
  #   · `path.delimiter`（`;` vs `:`）决定的 `CUBEONE_ALLOWED_ROOTS` 拆分；
  #   · `regen.sh` 相关用例需要 Git Bash（ubuntu 天然有，Windows 上要靠 runner 预装的 Git for Windows）。
  # 只跑一遍（3.13 / Node 22），不做矩阵：这里验的是"平台分支对不对"，不是版本组合。
  windows:
    name: windows（win32 分支唯一真跑处）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.2.0"

      # 与 ubuntu 的 pytest job 同命令，不开覆盖率：覆盖率口径按 ubuntu 定，两平台各算一套
      # 只会制造"哪个才算基线"的争论。
      - name: 运行单元测试
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # ⚠️ `shell: bash` 是必须的，不是风格选择：Windows 上默认 shell 是 pwsh，
      # **pwsh 不展开 glob**，`tests/node/*.test.mjs` 会被当字面量传给 node →
      # MODULE_NOT_FOUND（这正是 M1 期间在真机上踩到的形态）。
      # windows-latest 预装 Git for Windows，bash 可用。
      - name: Node 层单测
        shell: bash
        run: node --test tests/node/*.test.mjs

  # ── 静态检查 + 冒烟：脚本连语法都不对时，上面的用例可能压根没跑起来 ──────
  lint:
    name: 脚本检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ 本 job **故意**拉全历史（fetch-depth: 0），与 pytest / node / windows job 不同：
      #   看板一致性校验的判据③（发布一致性）依赖 `git tag`——打了 v0.6.*/v0.7.* 的 tag
      #   就必须能在看板上看到 T3.5 已记账。checkout 默认 fetch-depth: 1 且不拉 tag，
      #   那样该判据会**静默降级成 note**（等于加了一个在 CI 里从不生效的检查，正是本项目
      #   反复强调的"静默跳过等于假装检查过"）。代价只有本 job 多克隆一些历史。
      #   pytest / node / windows job 不需要 tag，故保持默认浅克隆，不跟着全量拉。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: bash 语法检查（regen.sh）
        run: bash -n scripts/regen.sh

      - name: Python 字节码编译（scripts/*.py）
        run: python -m py_compile scripts/*.py

      # 本步骤要跑 pytest --collect-only，故 lint job 也需要装 pytest（与 pytest job 同版本）。
      - name: 安装 pytest（供收集用例用）
        run: python -m pip install "pytest==9.2.0"

      # shellcheck 的处置方式：**只报告，不判红**。
      #   理由：scripts/ 的 owner 是 verifier-dev，本流水线的职责不是让上游脚本
      #   为风格问题返工；一旦判红，一次与本次改动无关的脚本风格调整就会挡住所有 PR。
      #   但"不判红"不等于"静默忽略"：结果会以 GitHub annotation 的形式挂在 PR 的
      #   diff 上，并写进 Job Summary，评审时看得见。
      #   降级是显式写出来的（if/else + ::warning::），不是 `|| true` 掩耳盗铃。
      - name: shellcheck（warning 及以上，非阻塞）
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::notice::未找到 shellcheck，跳过（ubuntu-latest 通常预装）"
            exit 0
          fi
          if shellcheck -S warning scripts/regen.sh; then
            echo "shellcheck: 无 warning 及以上问题" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            echo "::warning title=shellcheck::scripts/regen.sh 有 warning 及以上问题（非阻塞，见步骤日志）"
            {
              echo "### shellcheck：warning 及以上（非阻塞）"
              echo ""
              echo "shellcheck 退出码：\`${rc}\`。详见本步骤日志。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      # ── 看板一致性（M3 / R-E1）──────────────────────────────────────────
      # 为什么放在"脚本入口冒烟"之前：本步骤验的是**文档账目**（快照数字、证据链接、发布记账），
      # 它与脚本能否起来无关。先跑它，失败时的定位更直接（不会混在冒烟输出里）。
      # 三组判据：① 任务表 ↔ §4 快照逐段逐状态 + 小计/合计自算；② 证据路径存在性
      # （跳过 docs/logs/ 并打印跳过条数，否则 CI 上必然恒红）；③ tag 已存在时 T3.5 不得"待开始"。
      # 判据③ 依赖 tag ⇒ 本 job 的 checkout 已显式 `fetch-depth: 0`（见上方注释）。
      # 若有人把它改回浅克隆，判据③ 会退化成 note「仓库内没有可读 tag…该判据无适用对象」，
      # 而步骤**仍然绿**——所以那条 note 出现在 CI 日志里就是配置被改坏的信号，别当正常输出。
      - name: 看板一致性校验（TASKBOARD ↔ 快照 ↔ 证据路径）
        run: python tools/check_taskboard.py

      # ── 操作面状态词 + D 编号基准（W5-4 / A-6）────────────────────────────
      # 状态词判红：L5 已达成（phase2 报告），"无硬件 / 整体挂起 / 一律缺" 漂回操作面会让
      # agent 拒绝执行已验证能力（A-5）。
      # 状态词与 D 编号基准**同判红**（A-6 防再漂移）：C5/W3-3 已把 docs/README.md 同步为
      # D1–D36，顺序依赖解除，本护栏常驻生效。只给 ::warning 拦不住——把一处 D1–D36 改回
      # D1–D35 时 step 仍会绿，等于「看起来有检查、其实没拦住」。
      # 判红机制：状态词靠 `bad` 汇总后 exit；D 编号靠 Python 的 SystemExit(1)；
      # `set -euo pipefail` 下 Python 非零即让 step 红，状态词 annotation 在 Python 之前已打印。
      # 将来若新增 D37 而不同步 docs/README.md，lint 判红是**有意护栏**（与 D35 §35.6
      # 「在 D35 内追加、不新增 D37」的唯一决策真源一致），不是误伤。
      - name: 操作面状态词与 D 编号扫描
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for f in SKILL.md README.md; do
            for word in "无硬件" "整体挂起" "未实测（无硬件）" "一律缺"; do
              if grep -nF "$word" "$f"; then
                echo "::error file=${f}::命中已失效状态词「${word}」（L5 已达成，见 phase2 报告）"
                bad=1
              fi
            done
          done
          python - <<'PY'
          import re, pathlib
          root = pathlib.Path(".")
          decisions = (root / "docs/DECISIONS.md").read_text(encoding="utf-8")
          nums = [int(n) for n in re.findall(r"^### D(\d+)\b", decisions, re.M)]
          expected = max(nums) if nums else 0
          if expected == 0:
              print("::error::docs/DECISIONS.md 里找不到 ### D<n> 标题")
              raise SystemExit(1)
          index = (root / "docs/README.md").read_text(encoding="utf-8")
          stated = sorted({int(n) for n in re.findall(r"D1[–-]D(\d+)", index)})
          if stated and stated != [expected]:
              print(f"::error file=docs/README.md::D 编号基准不一致：docs/README.md 声明 {stated}，DECISIONS.md 最大号 D{expected}；请全文统一为 D1–D{expected}（唯一决策真源）")
              raise SystemExit(1)
          elif not stated:
              print(f"::error file=docs/README.md::未声明 D1–D<n> 区间（基准 D{expected}），请与 DECISIONS.md 最大号 D{expected} 对齐")
              raise SystemExit(1)
          else:
              print(f"D 编号基准一致：D1–D{expected}")
          PY
          exit "${bad}"

      # 版本轴 / 发布收口校验（C2.3）——**故意不挂 CI**，只在此处留一句说明，免得下一个人以为漏了。
      #   `tools/check_release.py` 的判据①要求"最新 tag == package.json == SKILL.md == README 两处"，
      #   而本仓的正常状态是**长期存在未发版改动**（改了代码但还没打 tag）——那种状态下判据①
      #   本来就会红。若挂进 CI，每次 push 都会红，红灯随即失去信息量（本项目最反对的形态）。
      #   正确用法：**发布前手动跑**，作为 GATE-3.1 证据包的一项。SOP 见 docs/DECISIONS.md D35。

      # 冒烟：这几个脚本都是纯标准库、不碰 CubeMX，能在 ubuntu-latest 上真跑通。
      # 目的是防"文件还在但入口坏了"这类只有到用户机器上才发现的退化。
      - name: 脚本入口冒烟（不依赖 CubeMX）
        run: |
          # 核验器必须仍是 schema /2（`--version` 输出里带 "/2"）；换了 schema 这条先红。
          python scripts/verify_generation.py --version | tee /tmp/vg-version.txt
          grep -q "/2" /tmp/vg-version.txt

          python scripts/ioc_backup.py --help > /dev/null
          python scripts/ioc_field.py --help > /dev/null

          # regen.sh 缺参数必须退 2（"压根没跑"），退别的码说明前置检查语义变了。
          # 这里显式捕获退出码 —— 让 `set -e` 不把"预期内的 2"当失败。
          set +e
          bash scripts/regen.sh > /tmp/regen-noargs.log 2>&1
          rc=$?
          set -e
          cat /tmp/regen-noargs.log
          if [ "$rc" -ne 2 ]; then
            echo "::error::regen.sh 缺参数应以 2 退出（未执行），实际 ${rc}"
            exit 1
          fi

      # 同名测试函数检查：同一个模块里重复 `def test_x`（列 0）时，后一个覆盖前一个，
      # 前一份永不执行，而 pytest 照样报表绿。危害不是覆盖率，而是"看起来有测试、
      # 实际没跑" —— 翻文件时先读到的是死代码，改它测试照绿、bug 照样溜过去。
      #
      # 为什么**不**直接比"收集数 == 声明数"（最初提的写法）：
      # `@pytest.mark.parametrize` 会让一条声明展开成多个用例。本仓现有 1 处
      # parametrize（3 个参数），实测（pytest 9.2.0）：声明 72 / 收集 74，
      # 相等口径在干净的仓库上就会误报。所以拆成两条独立判据：
      #   ① 逐文件找重名（这才是缺陷形态）→ 命中即 fail；
      #   ② 收集数 < 声明数 → fail（说明有函数没被收集到，比如导入期抛异常）。
      # 只数行首（列 0）的 `def test_`：类方法/嵌套函数本仓不存在，也不作为测试收集。
      - name: 测试函数重名检查
        run: |
          fail=0
          for f in tests/test_*.py; do
            dups=$(grep -o '^def test_[A-Za-z0-9_]*' "$f" | sort | uniq -d || true)
            if [ -n "$dups" ]; then
              echo "::error file=${f}::存在同名测试函数定义（后者覆盖前者，前者永远不会执行）：${dups}"
              fail=1
            fi
          done

          declared=$(grep -rhc '^def test_' tests/*.py | awk '{s+=$1} END {print s}')
          collected=$(python -m pytest tests/ --collect-only -q 2>/dev/null | grep -c '::')
          echo "declared=${declared} collected=${collected}"
          if [ "${collected}" -lt "${declared}" ]; then
            echo "::error::收集数 ${collected} 少于声明数 ${declared} —— 有测试函数未被收集"
            fail=1
          fi
          exit "${fail}"
